{% extends "secure_notes/base.html" %}

{% block page_header %}
  <h2 class="h2">Invalid verification link</h2>
  <hr>
{% endblock page_header %}

{% block content %}
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-sm-12 col-md-10 col-lg-8">
        <div class="card shadow-sm mb-3">
          <div class="card-body">
            <div class="alert alert-danger" role="alert">
              <h3 class="h5 alert-heading">Verification unsuccessful</h3>

              <p class="mb-0">
                This verification link is invalid or has been changed. Please
                request a new verification email.
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock content %}
